name: Temporary UI branding audit

on:
  push:
    branches:
      - agent/ui-branding-goods-to-ship

permissions:
  contents: read

jobs:
  audit-active-app:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ui-branding-goods-to-ship
          fetch-depth: 0

      - name: Print every active app Goodcashback occurrence
        shell: python
        run: |
          from pathlib import Path

          hits = []
          for path in sorted(Path("app").rglob("*")):
              if not path.is_file() or path.suffix not in {".ts", ".tsx", ".js", ".jsx"}:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              for lineno, line in enumerate(text.splitlines(), 1):
                  if "Goodcashback" in line or "Good Cashback" in line:
                      hits.append((str(path), lineno, line.strip()))

          print(f"ACTIVE_APP_BRAND_HITS={len(hits)}")
          for path, lineno, line in hits:
              print(f"BRAND_HIT|{path}|{lineno}|{line}")

          if not hits:
              raise SystemExit("FAIL: expected branding audit hits but found none")
