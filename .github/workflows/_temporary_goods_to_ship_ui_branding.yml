name: Temporary guarded UI branding replacement

on:
  push:
    branches:
      - agent/ui-branding-goods-to-ship

permissions:
  contents: write

jobs:
  replace-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ui-branding-goods-to-ship
          fetch-depth: 0

      - name: Apply audited presentation-only substitutions
        shell: python
        run: |
          from pathlib import Path

          replacements = [
              (b"Goodcashback Customer", b"Goods To Ship Customer"),
              (b"Goodcashback Importer", b"Goods To Ship Importer"),
              (b"Goodcashback Shipper", b"Goods To Ship Shipper"),
              (b"Goodcashback Internal", b"Goods To Ship Internal"),
              (b"Goodcashback customer review", b"Goods To Ship customer review"),
              (b">Goodcashback</p>", b">Goods To Ship</p>"),
              (b"Goodcashback Main Company Bank Account", b"Goods To Ship Main Company Bank Account"),
              (b"Goodcashback / tenant exporter", b"Goods To Ship / tenant exporter"),
          ]

          old_count = 0
          for path in Path("app").rglob("*"):
              if path.is_file() and path.suffix in {".ts", ".tsx", ".js", ".jsx"}:
                  data = path.read_bytes()
                  old_count += data.count(b"Goodcashback") + data.count(b"Good Cashback")
          if old_count != 42:
              raise SystemExit(f"FAIL: audited active-app source drifted; expected 42 old-brand hits, found {old_count}")

          changed = []
          substitutions = 0
          for path in sorted(Path("app").rglob("*.tsx")):
              before = path.read_bytes()
              after = before
              for old, new in replacements:
                  count = after.count(old)
                  substitutions += count
                  after = after.replace(old, new)
              if after != before:
                  path.write_bytes(after)
                  changed.append(str(path))

          if len(changed) != 39:
              raise SystemExit(f"FAIL: expected 39 changed UI files, got {len(changed)}")
          if substitutions != 42:
              raise SystemExit(f"FAIL: expected 42 substitutions, got {substitutions}")

          remaining = []
          for path in sorted(Path("app").rglob("*")):
              if path.is_file() and path.suffix in {".ts", ".tsx", ".js", ".jsx"}:
                  data = path.read_bytes()
                  if b"Goodcashback" in data or b"Good Cashback" in data:
                      remaining.append(str(path))
          if remaining:
              raise SystemExit("FAIL: old presentation brand remains: " + ", ".join(remaining))

          layout = Path("app/layout.tsx").read_bytes()
          if b'title: "Goods To Ship"' not in layout or b'description: "Goods To Ship app"' not in layout:
              raise SystemExit("FAIL: Goods To Ship root metadata missing")

          print(f"PASS: {substitutions} audited substitutions across {len(changed)} files")

      - name: Verify exact diff boundary
        shell: python
        run: |
          import subprocess
          changed = subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          if len(changed) != 39 or any(not p.startswith("app/") or not p.endswith(".tsx") for p in changed):
              raise SystemExit(f"FAIL: unexpected application diff paths: {changed}")
          diff = subprocess.check_output(["git", "diff", "--unified=0", "--", "app"], text=True)
          for line in diff.splitlines():
              if line.startswith(("+++", "---", "@@", "diff ", "index ")):
                  continue
              if line.startswith("-") and "Goodcashback" not in line and "Good Cashback" not in line:
                  raise SystemExit(f"FAIL: non-brand deletion: {line}")
              if line.startswith("+") and "Goods To Ship" not in line:
                  raise SystemExit(f"FAIL: non-brand addition: {line}")
          print("PASS: diff contains branding lines only")

      - name: Install dependencies without lockfile writes
        run: npm install --package-lock=false

      - name: Typecheck
        run: npm run typecheck

      - name: Compile production build without DB credentials
        shell: bash
        run: |
          set -uo pipefail
          set +e
          npm run build 2>&1 | tee /tmp/goods-to-ship-build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo "PASS: production build completed"
          elif grep -Fq "Compiled successfully" /tmp/goods-to-ship-build.log \
            && grep -Fq "Your project's URL and API key are required to create a Supabase client" /tmp/goods-to-ship-build.log; then
            echo "PASS: compiled and typechecked; prerender blocked only by absent CI Supabase credentials"
          else
            echo "FAIL: unexpected production build failure"
            exit "$status"
          fi
          rm -f /tmp/goods-to-ship-build.log

      - name: Verify protected tracked files untouched
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git status --porcelain | grep -vE '^ M app/.+\.tsx$' || true)"
          if [ -n "$unexpected" ]; then
            echo "FAIL: validation introduced unexpected tracked changes"
            echo "$unexpected"
            exit 1
          fi

      - name: Remove temporary workflow
        run: git rm .github/workflows/_temporary_goods_to_ship_ui_branding.yml

      - name: Commit verified UI-only replacement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app
          git commit -m "Replace user-visible UI branding with Goods To Ship"
          git push origin HEAD:agent/ui-branding-goods-to-ship
