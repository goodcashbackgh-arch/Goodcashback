name: PR 284 funding validation

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/pr284-funding-validation.yml"
      - "app/internal/funding/page.tsx"
      - "docs/testing/20260822_importer_funding_canonical_eligibility_regression_v1.mjs"
      - "docs/governing-pack/ui/IMPORTER_FUNDING_CANONICAL_STATEMENT_ELIGIBILITY_ADDENDUM_v1.md"

permissions:
  contents: read

jobs:
  validate:
    name: Regression, TypeScript and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run funding eligibility regression
        run: node docs/testing/20260822_importer_funding_canonical_eligibility_regression_v1.mjs

      - name: Run TypeScript validation
        run: npm run typecheck

      - name: Run production build
        run: npm run build
