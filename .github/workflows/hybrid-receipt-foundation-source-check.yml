name: Hybrid receipt foundation source check

on:
  push:
    branches:
      - agent/hybrid-receipt-foundation-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out audited Build 1 commit
        uses: actions/checkout@v4
        with:
          ref: 98b1fdc6a49f342cb321d3e171aeb736cb403ab2
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run source regression
        run: node docs/testing/20260801_hybrid_physical_receipt_foundation_source_regression_v1.mjs
