name: One-shot correct reconciliation label

on:
  push:
    branches:
      - contract/supervisor-exact-invoice-action-routing-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: contract/supervisor-exact-invoice-action-routing-v1
          fetch-depth: 0

      - name: Correct only the agreed wording
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('app/internal/invoice-review/page.tsx')
          page_text = page.read_text()
          old_page = 'Open supervisor actions</Link>'
          new_page = 'Open reconciliation</Link>'
          if page_text.count(old_page) != 1:
              raise SystemExit(f'Expected exactly one incorrect page label, found {page_text.count(old_page)}')
          page.write_text(page_text.replace(old_page, new_page, 1))

          contract = Path('docs/governing-pack/ui/SUPERVISOR_EXACT_INVOICE_ACTION_ROUTING_ADDENDUM_v1.md')
          contract_text = contract.read_text()
          label_count = contract_text.count('Open supervisor actions')
          if label_count != 2:
              raise SystemExit(f'Expected exactly two incorrect contract labels, found {label_count}')
          contract_text = contract_text.replace('Open supervisor actions', 'Open reconciliation')

          old_reason = 'The label must describe the destination accurately and must not imply that staff are entering the operator account or operator permission path.'
          new_reason = 'The label is frozen by the existing supervisor reconciliation contract and must not be changed by this routing-only patch.'
          if contract_text.count(old_reason) != 1:
              raise SystemExit('Expected exactly one incorrect label justification')
          contract.write_text(contract_text.replace(old_reason, new_reason, 1))

          workflow = Path('.github/workflows/one-shot-correct-reconciliation-label.yml')
          workflow.unlink()
          PY

      - name: Commit wording correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/internal/invoice-review/page.tsx docs/governing-pack/ui/SUPERVISOR_EXACT_INVOICE_ACTION_ROUTING_ADDENDUM_v1.md .github/workflows/one-shot-correct-reconciliation-label.yml
          git commit -m "fix: retain reconciliation button wording"
          git push origin HEAD:contract/supervisor-exact-invoice-action-routing-v1
