name: Fix hybrid receipt Build 2 regression

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/hybrid-receipt-build-2-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hybrid-receipt-build-2-v1
          fetch-depth: 0

      - name: Correct regression assertions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          sql_path = Path('docs/testing/20260801_hybrid_physical_receipt_build_2_receipt_regression_v1.sql')
          sql = sql_path.read_text(encoding='utf-8')

          old = "  IF v_rpc_definition NOT ILIKE '%SECURITY DEFINER%'\n     OR v_rpc_definition NOT ILIKE '%SET search_path TO public, pg_temp%'"
          new = "  IF v_rpc_definition NOT ILIKE '%SECURITY DEFINER%'\n     OR REPLACE(v_rpc_definition, '''', '') NOT ILIKE\n        '%SET search_path TO public, pg_temp%'"
          if sql.count(old) != 1:
            raise RuntimeError(f'Expected one search_path assertion, found {sql.count(old)}')
          sql = sql.replace(old, new, 1)

          old_position = "POSITION('SELECT count(*)::integer' IN LOWER(v_rpc_definition))"
          if sql.count(old_position) != 2:
            raise RuntimeError(f'Expected two position assertions, found {sql.count(old_position)}')
          sql = sql.replace(
            old_position,
            "POSITION('select count(*)::integer' IN LOWER(v_rpc_definition))",
          )
          sql_path.write_text(sql, encoding='utf-8')

          source_path = Path('docs/testing/20260801_hybrid_physical_receipt_build_2_receipt_source_regression_v1.mjs')
          source = source_path.read_text(encoding='utf-8')
          old_base = 'const BASE = process.env.BASE_REF || "main";'
          new_base = 'const BASE = process.env.BASE_REF || "origin/main";'
          if source.count(old_base) != 1:
            raise RuntimeError(f'Expected one source base declaration, found {source.count(old_base)}')
          source = source.replace(old_base, new_base, 1)
          source_path.write_text(source, encoding='utf-8')

          impact_path = Path('docs/implementation/20260801_hybrid_physical_receipt_build_2_impact_map_v1.md')
          impact = impact_path.read_text(encoding='utf-8')
          anchor = "## 5. Explicit Build 2 exclusions\n\nBuild 2 does not:\n"
          replacement = (
            "## 5. Explicit Build 2 exclusions\n\n"
            "There is no feature flag, pilot account or staged business rollout in Build 2.\n\n"
            "Build 2 does not:\n"
          )
          if impact.count(anchor) != 1:
            raise RuntimeError(f'Expected one impact exclusion anchor, found {impact.count(anchor)}')
          impact = impact.replace(anchor, replacement, 1)
          impact_path.write_text(impact, encoding='utf-8')

          Path('.github/workflows/fix-hybrid-receipt-build-2-regression.yml').unlink()
          PY

      - name: Create local fix commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix Build 2 receipt regression assertions"

      - name: Run source regression
        shell: bash
        run: BASE_REF=origin/main node docs/testing/20260801_hybrid_physical_receipt_build_2_receipt_source_regression_v1.mjs

      - name: Push verified correction
        shell: bash
        run: git push origin HEAD:agent/hybrid-receipt-build-2-v1
