name: Verify Build 2 source regression status

on:
  push:
    branches:
      - agent/hybrid-receipt-build-2-v1

permissions:
  contents: write
  statuses: write

jobs:
  source-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hybrid-receipt-build-2-v1
          fetch-depth: 0
      - name: Remove transient workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/run-build-2-importer-source-regression.yml
          git commit -m "ci: remove transient Build 2 source status workflow"
          git push origin HEAD:agent/hybrid-receipt-build-2-v1
          echo "STATUS_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Run source regression
        id: regression
        continue-on-error: true
        env:
          BASE_REF: origin/main
        run: node docs/testing/20260801_hybrid_physical_receipt_build_2_receipt_source_regression_v1.mjs
      - name: Publish source regression status
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.regression.outcome }}
        run: |
          if [ "$OUTCOME" = "success" ]; then STATE=success; DESCRIPTION="Build 2 source regression passed"; else STATE=failure; DESCRIPTION="Build 2 source regression failed"; fi
          gh api --method POST "repos/${{ github.repository }}/statuses/$STATUS_SHA" -f state="$STATE" -f context="Build 2 source regression" -f description="$DESCRIPTION"
          test "$STATE" = success
