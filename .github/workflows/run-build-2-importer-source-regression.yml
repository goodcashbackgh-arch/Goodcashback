name: Run Build 2 source regression once

on:
  push:
    branches:
      - agent/hybrid-receipt-build-2-v1

permissions:
  contents: write

jobs:
  source-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hybrid-receipt-build-2-v1
          fetch-depth: 0
      - name: Remove transient workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/run-build-2-importer-source-regression.yml
          git commit -m "ci: remove transient Build 2 source regression workflow"
          git push origin HEAD:agent/hybrid-receipt-build-2-v1
      - name: Run source regression
        env:
          BASE_REF: origin/main
        run: node docs/testing/20260801_hybrid_physical_receipt_build_2_receipt_source_regression_v1.mjs
