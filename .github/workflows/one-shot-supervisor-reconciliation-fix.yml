name: One-shot supervisor reconciliation route patch

on:
  push:
    branches:
      - fix/supervisor-operator-reconciliation-link-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/supervisor-operator-reconciliation-link-v1
          fetch-depth: 0

      - name: Apply fail-closed surgical patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}: found {count}")
              path.write_text(text.replace(old, new, 1))

          recon = Path("app/importer/reconciliation/[order_id]/page.tsx")
          review = Path("app/internal/invoice-review/page.tsx")

          replace_once(
              recon,
              'type Search = { success?: string; error?: string; supplier_invoice_id?: string };',
              'type Search = { success?: string; error?: string; supplier_invoice_id?: string; staff_mode?: string };',
          )

          replace_once(
              recon,
              '''  const { data: operator } = await supabase
              .from("operators")
              .select("id, full_name")
              .eq("auth_user_id", user.id)
              .eq("active", true)
              .maybeSingle();
            if (!operator) redirect("/auth/check");

            const { data: order } = await supabase''',
              '''  const [{ data: operator }, { data: staff }] = await Promise.all([
              supabase
                .from("operators")
                .select("id, full_name")
                .eq("auth_user_id", user.id)
                .eq("active", true)
                .maybeSingle(),
              supabase
                .from("staff")
                .select("id, full_name, role_type")
                .eq("auth_user_id", user.id)
                .eq("active", true)
                .maybeSingle(),
            ]);
            const staffAuthorised = Boolean(staff && ["admin", "supervisor"].includes(String(staff.role_type)));
            const supervisorMode = staffAuthorised && (qp.staff_mode === "1" || !operator);
            if (qp.staff_mode === "1" && !staffAuthorised) redirect("/internal");
            if (!operator && !supervisorMode) redirect("/auth/check");

            const { data: order } = await supabase''',
          )

          replace_once(
              recon,
              '  if (!order) redirect("/importer");',
              '  if (!order) redirect(supervisorMode ? "/internal" : "/importer");',
          )

          replace_once(
              recon,
              '''  const { data: access } = await supabase
              .from("operator_importers")
              .select("id")
              .eq("operator_id", operator.id)
              .eq("importer_id", order.importer_id)
              .is("revoked_at", null)
              .limit(1)
              .maybeSingle();
            if (!access) redirect("/importer");''',
              '''  if (!supervisorMode) {
              const { data: access } = await supabase
                .from("operator_importers")
                .select("id")
                .eq("operator_id", operator!.id)
                .eq("importer_id", order.importer_id)
                .is("revoked_at", null)
                .limit(1)
                .maybeSingle();
              if (!access) redirect("/importer");
            }''',
          )

          replace_once(
              recon,
              '<Link href={`/importer/orders/${orderId}/operations#invoice`} className="text-sm font-semibold text-sky-700">← Back to order evidence</Link>',
              '<Link href={supervisorMode ? "/internal/invoice-review" : `/importer/orders/${orderId}/operations#invoice`} className="text-sm font-semibold text-sky-700">← {supervisorMode ? "Back to invoice exceptions" : "Back to order evidence"}</Link>',
          )

          replace_once(
              recon,
              '<p className="mt-2 text-sm text-slate-600">The selected invoice stays separate; the baseline is counted once across all active invoices.</p>',
              '<p className="mt-2 text-sm text-slate-600">The selected invoice stays separate; the baseline is counted once across all active invoices.</p>\n          {supervisorMode ? <p className="mt-3 rounded-xl border border-sky-200 bg-sky-50 p-3 text-sm font-medium text-sky-900">Supervisor review mode: the operator workspace is shown read-only. Existing operator progression and exception actions are unchanged.</p> : null}',
          )

          replace_once(
              recon,
              'href={`/importer/reconciliation/${orderId}?supplier_invoice_id=${invoiceRow.id}`}',
              'href={`/importer/reconciliation/${orderId}?supplier_invoice_id=${invoiceRow.id}${supervisorMode ? "&staff_mode=1" : ""}`}',
          )

          replace_once(
              recon,
              '''        {invoice ? (
          <>''',
              '''        {invoice ? (
          <fieldset disabled={supervisorMode} className="contents">''',
          )

          replace_once(
              recon,
              '''          </>
        ) : null}''',
              '''          </fieldset>
        ) : null}''',
          )

          replace_once(
              review,
              '<Link href={`/importer/reconciliation/${invoice.order_id}`} className="rounded-full border border-sky-200 bg-sky-50 px-4 py-2 text-sm font-semibold text-sky-700 transition hover:bg-sky-100">Operator reconciliation</Link>',
              '<Link href={`/importer/reconciliation/${invoice.order_id}?supplier_invoice_id=${invoice.id}&staff_mode=1`} className="rounded-full border border-sky-200 bg-sky-50 px-4 py-2 text-sm font-semibold text-sky-700 transition hover:bg-sky-100">Operator reconciliation</Link>',
          )

          workflow = Path(".github/workflows/one-shot-supervisor-reconciliation-fix.yml")
          workflow.unlink()
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/importer/reconciliation/'[order_id]'/page.tsx app/internal/invoice-review/page.tsx .github/workflows/one-shot-supervisor-reconciliation-fix.yml
          git commit -m "fix: restore supervisor operator reconciliation access"
          git push origin HEAD:fix/supervisor-operator-reconciliation-link-v1
