name: Finalize Build 2 source gate

on:
  push:
    branches:
      - agent/hybrid-receipt-build-2-v1

permissions:
  contents: write
  statuses: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hybrid-receipt-build-2-v1
          fetch-depth: 0
      - name: Add privilege fix to source gate
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/testing/20260801_hybrid_physical_receipt_build_2_receipt_source_regression_v1.mjs')
          text = p.read_text()
          text = text.replace(
            'const receiptRegressionPath =\n',
            'const privilegeFixPath =\n  "supabase/migrations/20260801143100_hybrid_physical_receipt_supervisor_rpc_privilege_fix_v1.sql";\nconst receiptRegressionPath =\n',
            1,
          )
          text = text.replace(
            '  supervisorRpcPath,\n  receiptRegressionPath,',
            '  supervisorRpcPath,\n  privilegeFixPath,\n  receiptRegressionPath,',
            1,
          )
          text = text.replace(
            'const supervisorRpc = readFileSync(supervisorRpcPath, "utf8");\n',
            'const supervisorRpc = readFileSync(supervisorRpcPath, "utf8");\nconst privilegeFix = readFileSync(privilegeFixPath, "utf8");\n',
            1,
          )
          text = text.replace(
            '  [supervisorRpcPath, supervisorRpc],\n]) {',
            '  [supervisorRpcPath, supervisorRpc],\n  [privilegeFixPath, privilegeFix],\n]) {',
            1,
          )
          text = text.replace(
            '    compatibilityPath < supervisorRpcPath\n',
            '    compatibilityPath < supervisorRpcPath &&\n    supervisorRpcPath < privilegeFixPath\n',
            1,
          )
          text = text.replace(
            '"Build 2 migrations are not ordered guard -> receipt -> importer -> compatibility -> supervisor",',
            '"Build 2 migrations are not ordered guard -> receipt -> importer -> compatibility -> supervisor -> privilege fix",',
            1,
          )
          anchor = 'for (const prohibited of [\n  "DELETE FROM public.physical_exception_remedy_allocations",'
          block = '''for (const token of [
  "staff_decide_physical_receipt_review_v1",
  "FROM PUBLIC, anon",
  "TO authenticated",
]) {
  if (!privilegeFix.includes(token)) {
    fail(`supervisor privilege fix missing required control: ${token}`);
  }
}

'''
          if anchor not in text:
              raise SystemExit('source gate insertion anchor missing')
          text = text.replace(anchor, block + anchor, 1)
          p.write_text(text)
          PY
      - name: Remove transient workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/testing/20260801_hybrid_physical_receipt_build_2_receipt_source_regression_v1.mjs
          git rm .github/workflows/finalize-build-2-source-gate.yml
          git commit -m "test: include supervisor privilege fix in Build 2 source gate"
          git push origin HEAD:agent/hybrid-receipt-build-2-v1
      - name: Run source regression
        env:
          BASE_REF: origin/main
        run: node docs/testing/20260801_hybrid_physical_receipt_build_2_receipt_source_regression_v1.mjs
