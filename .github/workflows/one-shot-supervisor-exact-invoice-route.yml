name: One-shot supervisor exact invoice route patch

on:
  push:
    branches:
      - contract/supervisor-exact-invoice-action-routing-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: contract/supervisor-exact-invoice-action-routing-v1
          fetch-depth: 0

      - name: Apply exact one-link patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/internal/invoice-review/page.tsx')
          text = path.read_text()
          old = '<Link href={`/importer/reconciliation/${invoice.order_id}`} className="rounded-full border border-sky-200 bg-sky-50 px-4 py-2 text-sm font-semibold text-sky-700 transition hover:bg-sky-100">Operator reconciliation</Link>'
          new = '<Link href={`/internal/reconciliation/${invoice.order_id}/invoice-bundle/${invoice.id}`} className="rounded-full border border-sky-200 bg-sky-50 px-4 py-2 text-sm font-semibold text-sky-700 transition hover:bg-sky-100">Open supervisor actions</Link>'

          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one operator reconciliation link, found {count}')

          updated = text.replace(old, new, 1)
          if updated.count('/internal/reconciliation/${invoice.order_id}/invoice-bundle/${invoice.id}') != 1:
              raise SystemExit('Exact invoice route validation failed')
          if 'Operator reconciliation</Link>' in updated:
              raise SystemExit('Old button label still present')

          path.write_text(updated)
          Path('.github/workflows/one-shot-supervisor-exact-invoice-route.yml').unlink()
          PY

      - name: Commit surgical patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/internal/invoice-review/page.tsx .github/workflows/one-shot-supervisor-exact-invoice-route.yml
          git commit -m "fix: route supervisor to exact invoice actions"
          git push origin HEAD:contract/supervisor-exact-invoice-action-routing-v1
