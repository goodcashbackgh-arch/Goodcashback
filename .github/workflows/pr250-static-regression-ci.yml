name: PR250 static regression verification

on:
  push:
    branches:
      - test/pr250-static-regression-ci-20260814

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact PR250 head plus verification workflow
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run customer order review/correction static regression
        run: node docs/testing/20260813_customer_order_review_early_correction_regression_v1.mjs
