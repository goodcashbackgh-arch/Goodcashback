name: Publish full Build 2 dry-run artifact metadata

on:
  push:
    branches:
      - agent/hybrid-receipt-build-2-v1

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hybrid-receipt-build-2-v1
          fetch-depth: 0

      - name: Build rollback-only SQL bundle
        run: |
          cp docs/testing/GOODCASHBACK_FULL_BUILD_2_ROLLBACK_DRY_RUN_COPY_PASTE.txt GOODCASHBACK_FULL_BUILD_2_ROLLBACK_DRY_RUN_COPY_PASTE.txt

      - name: Upload artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: goodcashback-full-build-2-rollback-dry-run-final
          path: GOODCASHBACK_FULL_BUILD_2_ROLLBACK_DRY_RUN_COPY_PASTE.txt
          if-no-files-found: error
          retention-days: 7

      - name: Record artifact metadata and remove transient files
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          printf 'artifact_id=%s\nartifact_url=%s\nartifact_digest=%s\nrun_id=%s\n' \
            "$ARTIFACT_ID" "$ARTIFACT_URL" "$ARTIFACT_DIGEST" "${{ github.run_id }}" \
            > docs/testing/GOODCASHBACK_FULL_BUILD_2_ARTIFACT_METADATA.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/testing/GOODCASHBACK_FULL_BUILD_2_ARTIFACT_METADATA.txt
          git rm .github/workflows/publish-build-2-full-dry-run-artifact.yml
          git commit -m "ci: record full Build 2 dry-run artifact metadata"
          git push origin HEAD:agent/hybrid-receipt-build-2-v1
