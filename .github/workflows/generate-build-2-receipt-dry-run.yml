name: Generate Build 2 receipt dry run

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  generate:
    if: github.head_ref == 'agent/hybrid-receipt-build-2-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hybrid-receipt-build-2-v1
      - name: Assemble rollback-only SQL
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          sources = [
            Path('supabase/migrations/20260801139900_hybrid_physical_receipt_v2_terminal_correction_guard_v1.sql'),
            Path('supabase/migrations/20260801140000_hybrid_physical_receipt_v2_rpc_v1.sql'),
            Path('docs/testing/20260801_hybrid_physical_receipt_build_2_receipt_regression_v1.sql'),
          ]

          def strip_transaction(text: str) -> str:
            lines = text.splitlines()
            while lines and not lines[0].strip():
              lines.pop(0)
            if lines and lines[0].strip().upper() == 'BEGIN;':
              lines.pop(0)
            while lines and not lines[0].strip():
              lines.pop(0)
            while lines and not lines[-1].strip():
              lines.pop()
            if lines and lines[-1].strip().upper() in {'COMMIT;', 'ROLLBACK;'}:
              lines.pop()
            while lines and not lines[-1].strip():
              lines.pop()
            return '\n'.join(lines)

          out = [
            '-- GOODCASHBACK BUILD 2 RECEIPT AUTHORITY — PRODUCTION ROLLBACK DRY RUN',
            '-- Generated mechanically from the frozen Build 2 branch files.',
            '-- Safe intent: all schema changes and checks are rolled back at the end.',
            '',
            'BEGIN;',
            '',
            "SET LOCAL lock_timeout = '15s';",
            "SET LOCAL statement_timeout = '0';",
          ]

          for source in sources:
            out.extend([
              '',
              '-- ============================================================================',
              f'-- SOURCE: {source.as_posix()}',
              '-- ============================================================================',
              '',
              strip_transaction(source.read_text(encoding='utf-8')),
            ])

          out.extend([
            '',
            '-- Final safety boundary: nothing above persists.',
            'ROLLBACK;',
            '',
          ])

          target = Path('goodcashback_build_2_receipt_production_rollback_dry_run.sql')
          target.write_text('\n'.join(out), encoding='utf-8')

          text = target.read_text(encoding='utf-8')
          assert text.count('\nBEGIN;') == 1
          assert text.rstrip().endswith('ROLLBACK;')
          assert '\nCOMMIT;' not in text
          assert text.count('CREATE FUNCTION public.shipper_record_package_receipt_v2(') == 1
          print(f'Generated {target} with {len(text.splitlines())} lines')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: build-2-receipt-production-rollback-dry-run
          path: goodcashback_build_2_receipt_production_rollback_dry_run.sql
          if-no-files-found: error
