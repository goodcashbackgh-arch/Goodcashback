name: Cleanup Build 2 importer generator

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'agent/hybrid-receipt-build-2-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hybrid-receipt-build-2-v1
          fetch-depth: 0
      - name: Remove temporary workflows
        shell: bash
        run: |
          rm -f .github/workflows/generate-build-2-importer-dry-run.yml
          rm -f .github/workflows/cleanup-build-2-importer-generator.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Remove temporary Build 2 importer workflows"
          git push origin HEAD:agent/hybrid-receipt-build-2-v1
