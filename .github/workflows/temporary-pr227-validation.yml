name: Temporary PR 227 validation

on:
  push:
    branches:
      - codex/grouped-refund-correction-build-2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Targeted lint
        run: >-
          npx eslint
          'app/internal/physical-receipts/[review_id]/OutcomeLaneDecisionForm.tsx'
          'app/internal/physical-receipts/[review_id]/actions.ts'
          'app/internal/physical-receipts/[review_id]/page.tsx'
          'app/internal/physical-receipts/page.tsx'
          'docs/testing/20260804_grouped_physical_outcome_lane_ui_source_regression_v1.mjs'
          'docs/testing/20260803_same_order_free_replacement_authorities_source_regression_v1.mjs'

      - name: Grouped outcome lane UI source regression
        run: node docs/testing/20260804_grouped_physical_outcome_lane_ui_source_regression_v1.mjs

      - name: Same-order replacement source regression
        run: node docs/testing/20260803_same_order_free_replacement_authorities_source_regression_v1.mjs

      - name: Hybrid physical receipt v1.2 source regression
        run: npm run test:hybrid-physical-receipt-v1-2
