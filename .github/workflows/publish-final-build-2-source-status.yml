name: Publish final Build 2 source status

on:
  push:
    branches:
      - agent/hybrid-receipt-build-2-v1

permissions:
  contents: write
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hybrid-receipt-build-2-v1
          fetch-depth: 0
      - name: Remove transient workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-final-build-2-source-status.yml
          git commit -m "ci: remove final Build 2 source status workflow"
          git push origin HEAD:agent/hybrid-receipt-build-2-v1
      - name: Run source regression and publish status
        env:
          BASE_REF: origin/main
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(git rev-parse HEAD)
          if node docs/testing/20260801_hybrid_physical_receipt_build_2_receipt_source_regression_v1.mjs; then
            STATE=success
          else
            STATE=failure
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
            -d "{\"state\":\"${STATE}\",\"context\":\"Build 2 source regression\",\"description\":\"Final Build 2 source regression\"}"
          test "$STATE" = success
